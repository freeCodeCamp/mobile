name: Flutter iOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile-app/**"
      - ".github/workflows/flutter-ios.yml"
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
      - ".github/workflows/flutter-ios.yml"

permissions:
  contents: read

concurrency:
  group: flutter-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: iOS integration tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING: "YES"
      FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS: "YES"
      FLUTTER_XCODE_SWIFT_ENABLE_EXPLICIT_MODULES: "YES"

    steps:
      - name: Checkout files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Create .env file
        env:
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        run: |
          for name in HASHNODE_PUBLICATION_ID ALGOLIA_APP_ID ALGOLIA_KEY AUTH0_DOMAIN AUTH0_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. Fork pull requests cannot access repository secrets."
              exit 1
            fi
          done
          printf '%s\n' \
            "HASHNODE_PUBLICATION_ID=$HASHNODE_PUBLICATION_ID" \
            "ALGOLIAAPPID=$ALGOLIA_APP_ID" \
            "ALGOLIAKEY=$ALGOLIA_KEY" \
            "AUTH0_DOMAIN=$AUTH0_DOMAIN" \
            "AUTH0_CLIENT_ID=$AUTH0_CLIENT_ID" > .env

      - name: Start iOS simulator
        run: |
          xcodebuild -version
          xcrun simctl shutdown all
          simulator_id=$(xcrun simctl create "freeCodeCamp CI" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          echo "IOS_SIMULATOR_UDID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"

      - name: Setup Flutter 3.44.3
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            mobile-app/build/ios/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-flutter-3.44.3-${{ hashFiles('mobile-app/pubspec.lock', 'mobile-app/ios/**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-flutter-3.44.3-

      - name: Configure compilation cache
        run: |
          echo "FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH=$RUNNER_TEMP/CompilationCache.noindex" >> "$GITHUB_ENV"
          echo "XCBUILD_METRICS_PATH=$RUNNER_TEMP/xcode-build-metrics.json" >> "$GITHUB_ENV"

      - name: Cache Xcode compilations
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH }}
          # Hash checked-in native inputs before Flutter generates project files.
          key: ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-flutter-3.44.3-${{ hashFiles('mobile-app/pubspec.lock', 'mobile-app/ios/**') }}
          restore-keys: |
            ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-flutter-3.44.3-

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub global activate flutterfire_cli

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils

      - name: Wait for iOS simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b

      - name: Run iOS integration tests
        run: dart integration_test_runner.dart --ios 2>&1 | tee ios-integration-tests.log

      - name: Collect compilation cache metrics
        if: always()
        run: |
          if [ -d "$FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH" ]; then
            du -sh "$FLUTTER_XCODE_COMPILATION_CACHE_CAS_PATH"
          fi
          if [ -f "$XCBUILD_METRICS_PATH" ]; then
            mkdir -p screenshots
            cp "$XCBUILD_METRICS_PATH" screenshots/xcode-build-metrics.json
          else
            echo "::notice::Xcode did not emit compilation cache metrics."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: |
            mobile-app/screenshots/
            mobile-app/ios-integration-tests.log
          retention-days: 7
