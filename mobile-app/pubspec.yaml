name: freecodecamp
description: freecodecamp.org app.
publish_to: none
version: 8.0.0+80000
environment:
  sdk: ^3.12.2
dependencies:
  algolia_helper_flutter: 1.6.0
  audio_service: 0.18.19
  auth0_flutter: 3.1.0
  cached_network_image: 4.0.6
  collection: 1.19.1
  cupertino_icons: 2.0.0
  dio: 5.11.1
  firebase_analytics: 13.0.1
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_remote_config: 7.0.1
  flutter:
    sdk: flutter
  flutter_custom_tabs: 2.6.0
  flutter_dotenv: 6.0.1
  flutter_heatmap_calendar: 1.0.5
  flutter_html: 3.0.0
  flutter_html_table: 3.0.0
  flutter_inappwebview: 6.2.0-beta.3
  flutter_local_notifications: 22.3.3
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.2
  flutter_timezone: 5.1.1
  freezed_annotation: 3.1.0
  go_router: 18.1.2
  graphql: 5.2.4
  # Article languages beyond PhoneIDE's HTML, CSS, JavaScript, and Python grammars.
  highlight: 0.7.0
  html: 0.15.6
  intl: 0.20.3
  jiffy: 6.4.5
  json_annotation: 4.12.0
  just_audio: 0.10.6
  package_info_plus: 10.2.2
  path: 1.9.1
  path_provider: 2.1.6
  # Custom editor themes and layout from PhoneIDE PR #88.
  phone_ide:
    git:
      url: https://github.com/Sembauke/PhoneIDE.git
      ref: 279f4d513d43d348a0b5ded39b01f3e181ec0302
  photo_view: 0.15.0
  pretty_dio_logger: 1.4.0
  riverpod_annotation: 4.0.7
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  timezone: 0.11.2
  upgrader: 13.7.0
  url_launcher: 6.3.3
  web_socket_channel: 3.0.3
  youtube_player_iframe: 6.0.2

dependency_overrides:
  # This upstream revision has the same highlighting engine and grammar/theme
  # assets as 0.5.0, before its unrelated CodeEditor/clipboard widget was added.
  # That widget pulls native clipboard plugins incompatible with Gradle 9 and
  # share_plus's win32 6 dependency. PhoneIDE only uses the highlighting API.
  # Remove when a published highlighter no longer brings those incompatibilities.
  syntax_highlight:
    git:
      url: https://github.com/serverpod/syntax_highlight.git
      ref: 6331de462c1a7314cdf089d140aac71060692d46

dev_dependencies:
  build_runner: 2.16.2
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.3
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  riverpod_generator: 4.0.9

flutter:
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
    - family: monospace
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: Hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/JetBrainsMono/OFL.txt
    - assets/icons/
    - assets/images/
    - assets/learn/
    - assets/test_runner/dist/
    - assets/test_runner/babel/
